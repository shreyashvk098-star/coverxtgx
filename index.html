  <!-- Global Fetch Setter Guard & Error Resilience -->
  <script>
    (function() {
      try {
        var _fetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
        var accessor = {
          get: function() { return _fetch; },
          set: function(val) { _fetch = val; },
          configurable: true,
          enumerable: true
        };
        var p = window;
        while (p) {
          try {
            var d = Object.getOwnPropertyDescriptor(p, 'fetch');
            if (d && !d.set) {
              Object.defineProperty(p, 'fetch', accessor);
            }
          } catch (e1) {}
          p = Object.getPrototypeOf(p);
        }
        if (typeof Window !== 'undefined' && Window.prototype) {
          try { Object.defineProperty(Window.prototype, 'fetch', accessor); } catch (e2) {}
        }
        try { Object.defineProperty(window, 'fetch', accessor); } catch (e3) {}
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          try { Object.defineProperty(globalThis, 'fetch', accessor); } catch (e4) {}
        }
      } catch (err) {}

      window.addEventListener('error', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        return true;
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.preventDefault) e.preventDefault();

      }, true);
      window.onerror = function() { return true; };

    })();

  <!-- Disable DevTool & Third-Party Ad Shield for Streams -->
  <script disable-devtool-auto="" disable-menu="true" clear-log="true" src="https://cdn.jsdelivr.net/npm/disable-devtool"></script>
  <script>
    (function() {
      // 1. Context Menu & DevTools Shortcut Prevention
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('keydown', function(e) {
        // F12
        if (e.keyCode === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+Shift+I (73), Ctrl+Shift+J (74), Ctrl+Shift+C (67), Ctrl+Shift+K (75)
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.keyCode === 75)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+U (85), Ctrl+S (83)
        if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Mac: Cmd+Option+I (73), Cmd+Option+J (74), Cmd+Option+C (67), Cmd+Option+K (75)
        if (e.metaKey && e.altKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.keyCode === 75)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        if (e.metaKey && (e.keyCode === 85 || e.keyCode === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });

      // 2. Strict Stream Ad & Popup Blocker (Allows official Telegram community only)
      const allowedTelegramUrls = ['https://t.me/CoverxTg', 'tg://resolve?domain=CoverxTg'];
      const nativeWindowOpen = window.open;
      window.open = function(url, target, features) {
        if (!url) return null;
        const targetStr = String(url).trim();
        const isTelegram = allowedTelegramUrls.some(allowed => targetStr.startsWith(allowed));
        if (isTelegram) {
          return nativeWindowOpen.call(window, url, target, features);
        }
        console.warn('[Ad Shield] Blocked unauthorized stream popup:', targetStr);
        return null;
      };

      // 3. Prevent third-party click hijackers from navigating the page away
      window.addEventListener('click', function(e) {
        let el = e.target;
        while (el && el !== document.body) {
          if (el.tagName === 'A' && el.href) {
            const href = el.getAttribute('href') || '';
            const isSelfAnchor = href.startsWith('#') || href.startsWith('javascript:');
            const isInternal = href.startsWith('/') || href.startsWith(window.location.origin);
            const isTelegram = allowedTelegramUrls.some(allowed => href.startsWith(allowed));
            if (!isSelfAnchor && !isInternal && !isTelegram) {
              e.preventDefault();
              e.stopPropagation();
              console.warn('[Ad Shield] Blocked external link redirect:', href);
              return false;
            }
          }
          el = el.parentElement;
        }
      }, { capture: true });

      // 4. DisableDevtool Initialization
      window.addEventListener('DOMContentLoaded', function() {
        if (window.DisableDevtool) {
          try {
            window.DisableDevtool({
              disableMenu: true,
              clearLog: true,
              disableSelect: false,
              disableCopy: false,
              disableCut: false,
              disablePaste: false,
              interval: 400
            });
          } catch(e) {}
        }
      });
    })();
  </script>

    // Helper: Find channel by numeric ID, slug, or alias
    function findChannelById(idOrSlug) {
      if (!idOrSlug) return null;
      const target = String(idOrSlug).trim().toLowerCase();
      return allChannels.find(c => 
        String(c.id).toLowerCase() === target ||
        (c.slug && c.slug.toLowerCase() === target) ||
        (c.aliases && c.aliases.some(a => String(a).toLowerCase() === target))
      ) || null;
    }

    // State Variables

    // Status helper
    function setStatus(type, message) {
      statusPill.className = "show " + type;

    // Render Compact Channel Cards
    function renderChannels() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = allChannels.filter(c => {
        if (!q) return true;
        if (String(c.id) === q) return true;
        if (c.name.toLowerCase().includes(q)) return true;
        if (c.aliases && c.aliases.some(a => a.toLowerCase().includes(q))) return true;
        return false;
      });

      chGrid.innerHTML = "";

      if (filtered.length === 0) {
        chGrid.innerHTML = '<div class="no-results">No channels found matching "' + q + '"</div>';
        return;
      }

      filtered.forEach((channel) => {
        const card = document.createElement("div");
        card.className = "ch-card";
        card.dataset.channelId = String(channel.id);
        if (channel.slug) card.dataset.channelSlug = channel.slug;
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.title = channel.name + " (Channel " + channel.id + ")";

        // Creamy background for Star Sports 1 HD, Star Sports 1 Hindi, Star Sports 2 HD cards
        const isStarCreamy = (
          ["star-sports-1-hd", "star-sports-1-hindi", "star-sports-2-hd"].includes(channel.slug) || 
          ["9", "10", "11"].includes(String(channel.id)) ||
          channel.name.includes("STAR SPORTS 1") || channel.name.includes("STAR SPORTS 2")
        );
        if (isStarCreamy) {
          card.classList.add("creamy-card");
        }

        // Highlight if currently selected
        if (currentChannel && String(currentChannel.id) === String(channel.id)) {
          card.classList.add("selected", "active");
        }

        // Channel Number ID Tag
        const idTag = document.createElement("div");
        idTag.className = "ch-card-id";
        idTag.textContent = "CH " + channel.id;
        card.appendChild(idTag);

        // Channel Logo or Fallback
        if (channel.logo) {
          const img = document.createElement("img");
          img.className = "ch-logo";
          img.src = channel.logo;
          img.alt = channel.name;
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          let triedFallback = false;
          img.onerror = function() {
            if (!triedFallback && channel.fallbackLogo) {
              triedFallback = true;
              this.src = channel.fallbackLogo;
            } else {
              this.style.display = "none";
              if (this.nextElementSibling) this.nextElementSibling.style.display = "flex";
            }
          };
          card.appendChild(img);

          const fallback = document.createElement("div");
          fallback.className = "ch-logo-fallback";
          fallback.style.display = "none";
          fallback.textContent = channel.name.slice(0, 3);
          card.appendChild(fallback);
        } else {
          const fallback = document.createElement("div");
          fallback.className = "ch-logo-fallback";
          fallback.textContent = channel.name.slice(0, 3);
          card.appendChild(fallback);
        }

        const nameSpan = document.createElement("span");
        nameSpan.textContent = channel.name;
        card.appendChild(nameSpan);

        card.addEventListener("click", () => {
          selectChannel(channel, true);
        });

        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectChannel(channel, true);
          }
        });

        chGrid.appendChild(card);
      });
    }

    // Shaka Player & MPEG-TS Engine Initializer
    async function initShakaEngine() {
      if (window.shaka) {
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
          try {
            const video = document.getElementById("videoPlayer");
            const container = document.getElementById("shakaContainer");
            shakaPlayer = new shaka.Player();
            await shakaPlayer.attach(video);

            if (window.shaka.ui && shaka.ui.Overlay && container) {
              shakaUi = new shaka.ui.Overlay(shakaPlayer, container, video);
              shakaUi.configure({
                controlPanelElements: [
                  'play_pause', 'time_and_duration', 'mute', 'volume',
                  'spacer', 'language', 'captions', 'picture_in_picture',
                  'quality', 'fullscreen'
                ],
                volumeBarColors: {
                  base: 'rgba(0, 136, 204, 0.3)',
                  level: 'rgb(0, 136, 204)'
                },
                seekBarColors: {
                  base: 'rgba(255, 255, 255, 0.2)',
                  buffered: 'rgba(0, 136, 204, 0.4)',
                  played: '#0088CC'
                }
              });
            }

            shakaPlayer.configure({
              streaming: {
                lowLatencyMode: true,
                bufferingGoal: 20,
                rebufferingGoal: 2,
                bufferBehind: 30,
                retryParameters: {
                  timeout: 12000,
                  maxAttempts: 5,
                  baseDelay: 400,
                  backoffFactor: 1.2
                },
                segmentRequestTimeout: 10000,
                segmentPrefetchLimit: 3,
                useNativeHlsOnSafari: true
              },
              manifest: {
                retryParameters: {
                  timeout: 10000,
                  maxAttempts: 4
                }
              }
            });

            shakaPlayer.addEventListener('error', (event) => {
              console.warn("[Shaka Player Error]", event.detail);
            });
            console.log("[Shaka] Player ready.");
          } catch (e) {
            console.error("[Shaka Init Failed]", e);
          }
        }
      }
    }
    initShakaEngine();

    // Cleanup active playback across all engines
    function cleanupPlayback() {
      if (currentMpegts) {
        try {
          currentMpegts.pause();
          currentMpegts.unload();
          currentMpegts.detachMediaElement();
          currentMpegts.destroy();
        } catch (e) {}
        currentMpegts = null;
      }
      if (shakaPlayer) {
        try {
          shakaPlayer.unload();
        } catch (e) {}
      }
      if (currentHls) {
        try {
          currentHls.stopLoad();
          currentHls.detachMedia();
          currentHls.destroy();
        } catch (e) {}
        currentHls = null;
      }
      try {
        videoPlayer.pause();
        videoPlayer.removeAttribute("src");
        videoPlayer.load();
      } catch (e) {}

      const shakaContainer = document.getElementById("shakaContainer");
      if (shakaContainer) shakaContainer.style.display = "none";
      videoPlayer.style.display = "none";

      try {
        iframePlayer.src = "about:blank";
      } catch (e) {}
      iframePlayer.style.display = "none";
    }

    // Update UI highlights and headings for the selected channel
    function updateSelectedChannelUI(channel) {
      if (!channel) return;

      // Highlight active channel card
      const cards = chGrid.querySelectorAll(".ch-card");
      cards.forEach(c => {
        if (c.dataset.channelId === String(channel.id)) {
          c.classList.add("selected", "active");
        } else {
          c.classList.remove("selected", "active");
        }
      });

      // Update main channel heading banner
      if (selectedChannelHeading) {
        selectedChannelHeading.textContent = channel.name + " (CH " + channel.id + ")";
      }

      // Creamy website background for Star Sports 1 HD, Star Sports 1 Hindi, Star Sports 2 HD
      const isStarCreamy = (
        ["star-sports-1-hd", "star-sports-1-hindi", "star-sports-2-hd"].includes(channel.slug) || 
        ["9", "10", "11"].includes(String(channel.id)) ||
        channel.name.includes("STAR SPORTS 1") || channel.name.includes("STAR SPORTS 2")
      );
      if (isStarCreamy) {
        document.body.classList.add("star-creamy-bg");
      } else {
        document.body.classList.remove("star-creamy-bg");
      }

      // Update browser tab title
      document.title = channel.name + " • COVERXTG LINKS";
    }

    // Select channel: update URL param, update UI, and launch stream
    function selectChannel(channel, updateUrl = true) {
      if (!channel) return;
      currentChannel = channel;

      // Update URL without whole-page reload
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("id", channel.id);
        window.history.pushState({}, "", url);
      }

      // Highlight button and update headings
      updateSelectedChannelUI(channel);

      // Load channel's exact source URL into player
      openPlayer(channel);
    }

    // Open Player and stream exact channel source URL
    function openPlayer(channel) {
      currentChannel = channel;
      cleanupPlayback();

      pcTitle.textContent = channel.name + " (CH " + channel.id + ")";
      pc.classList.add("active");
      overlay.style.display = "flex";
      loadMsg.textContent = "Loading " + channel.name + "...";
      setStatus("live", channel.name);

      const streamUrl = channel.url || channel.streamUrl;
      const isEmbed = channel.type === "embed";
      const isMpegts = channel.type === "mpegts";

      if (isEmbed) {
        // Use Iframe Player: Load exact configured source URL into iframe with anti-ad sandbox
        const shakaContainer = document.getElementById("shakaContainer");
        if (shakaContainer) shakaContainer.style.display = "none";
        videoPlayer.style.display = "none";
        iframePlayer.style.display = "block";
        iframePlayer.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-presentation");
        const targetSrc = channel.iframeSrc || channel.url;
        iframePlayer.src = targetSrc;

        iframePlayer.onload = function() {
          overlay.style.display = "none";
          setStatus("live", channel.name);
        };

        setTimeout(() => {
          overlay.style.display = "none";
          setStatus("live", channel.name);
        }, 1500);
      } else if (isMpegts) {
        // Use mpegts.js for live continuous MPEG-TS streams over /api/proxy (Sky Sport, TNT Premium)
        iframePlayer.style.display = "none";
        const shakaContainer = document.getElementById("shakaContainer");
        if (shakaContainer) shakaContainer.style.display = "none";
        videoPlayer.style.display = "block";

        if (window.mpegts && mpegts.isSupported()) {
          try {
            const player = mpegts.createPlayer({
              type: 'mse',
              isLive: true,
              url: streamUrl,
              hasAudio: true,
              hasVideo: true,
              enableStashBuffer: false,
              stashInitialSize: 128
            }, {
              enableWorker: true,
              lazyLoad: false,
              liveBufferLatencyChasing: true,
              liveBufferLatencyMaxLatency: 2.0,
              liveBufferLatencyMinRemain: 0.5
            });

            currentMpegts = player;
            player.attachMediaElement(videoPlayer);
            player.load();
            player.play().catch(() => {});

            overlay.style.display = "none";
            setStatus("live", channel.name);

            player.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
              console.warn("[MPEG-TS Error]", errorType, errorDetail, errorInfo);
              setStatus("warn", "BUFFERING");
            });

            videoPlayer.onplaying = function() {
              overlay.style.display = "none";
              setStatus("live", channel.name);
            };
          } catch (err) {
            console.error("[MPEG-TS Init Error]", err);
            fallbackDirect(streamUrl, channel);
          }
        } else {
          fallbackDirect(streamUrl, channel);
        }
      } else {
        // Primary Native Engine: Google Shaka Player!
        iframePlayer.style.display = "none";
        const shakaContainer = document.getElementById("shakaContainer");
        if (shakaContainer) shakaContainer.style.display = "block";
        videoPlayer.style.display = "block";

        if (shakaPlayer) {
          shakaPlayer.load(streamUrl).then(() => {
            overlay.style.display = "none";
            setStatus("live", channel.name);
            videoPlayer.play().catch(() => {});
          }).catch((error) => {
            console.warn("[Shaka Load Error, using HLS fallback]", error);
            fallbackHls(streamUrl, channel);
          });
        } else {
          fallbackHls(streamUrl, channel);
        }
      }
    }

    // Fallback: HLS.js streaming engine with anti-lag recovery
    function fallbackHls(streamUrl, channel) {
      if (window.Hls && Hls.isSupported() && (streamUrl.includes(".m3u8") || channel.type === "hls")) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 45,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          maxBufferSize: 60 * 1000 * 1000,
          maxBufferHole: 0.5,
          highBufferWatchdogPeriod: 2,
          nudgeOffset: 0.1,
          nudgeMaxRetry: 5,
          maxFragLookUpTolerance: 0.25,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 8,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 6,
          manifestLoadingMaxRetry: 6,
          startLevel: -1,
          autoLevelCapping: -1
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(videoPlayer);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          overlay.style.display = "none";
          setStatus("live", channel.name);
          videoPlayer.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            if (channel.fallbackStreamUrl && streamUrl !== channel.fallbackStreamUrl) {
              hls.loadSource(channel.fallbackStreamUrl);
            } else {
              hls.recoverMediaError();
            }
          }
        });

        currentHls = hls;
      } else {
        fallbackDirect(streamUrl, channel);
      }
    }

    // Direct native video fallback
    function fallbackDirect(streamUrl, channel) {
      videoPlayer.src = streamUrl;
      videoPlayer.onloadedmetadata = function() {
        overlay.style.display = "none";
        setStatus("live", channel.name);
        videoPlayer.play().catch(() => {});
      };
      videoPlayer.onerror = function() {
        overlay.style.display = "none";
        setStatus("err", "STREAM ERROR");
      };
    }

    // Close Player and return to Channel Grid View
    function closePlayer(updateUrl = true) {
      cleanupPlayback();
      pc.classList.remove("active");
      overlay.style.display = "none";
      setStatus("ok", "COVERXTG");
      currentChannel = null;

      // Clear selection highlights from all channel cards
      const cards = chGrid.querySelectorAll(".ch-card");
      cards.forEach(c => c.classList.remove("selected", "active"));

      const chSelectedBanner = document.getElementById("ch-selected-banner");
      if (chSelectedBanner) {
        chSelectedBanner.style.display = "none";
      }

      document.body.classList.remove("star-creamy-bg");
      document.title = "COVERXTG LINKS • Live Sports TV";

      // Update URL to root when closing player overlay
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.delete("id");
        window.history.pushState({}, "", url.pathname + (url.search ? url.search : ""));
      }
    }

    // Back button click handlers
    btnBack.addEventListener("click", () => closePlayer(true));
    if (btnFloatingBack) {
      btnFloatingBack.addEventListener("click", () => closePlayer(true));
    }

    // Browser Back and Forward navigation listener (popstate)
    window.addEventListener("popstate", () => {
      const params = new URLSearchParams(window.location.search);
      const currentId = params.get("id");

      if (currentId) {
        const ch = findChannelById(currentId);
        if (ch) {
          selectChannel(ch, false);
          return;
        }
      }

      // Returned to root / without ?id= parameter: show all channels
      closePlayer(false);
    });

    // Reload stream
    btnReload.addEventListener("click", () => {
      if (currentChannel) {
        openPlayer(currentChannel);
      }
    });

    // Fullscreen toggle
    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        if (pc.requestFullscreen) {
          pc.requestFullscreen().catch(() => {});

          pc.webkitRequestFullscreen();
        }
      } else {

          document.exitFullscreen().catch(() => {});

    // Telegram Modal Handlers
    const tgBadge = document.getElementById("tgBadge");
    if (tgBadge) {
      tgBadge.addEventListener("click", (e) => {
        e.preventDefault();
        tgModal.classList.add("active");

    btnCloseModal.addEventListener("click", () => {
      tgModal.classList.remove("active");
    });
    tgModal.addEventListener("click", (e) => {
      if (e.target === tgModal) {
        tgModal.classList.remove("active");
      }
    });

    // Show Telegram Pop-up on initial homepage visit after brief moment
    setTimeout(() => {
      if (!pc.classList.contains("active") && !sessionStorage.getItem("tgModalDismissed")) {
        tgModal.classList.add("active");
      }
    }, 1800);

    // Escape and Backspace Key Listener
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (tgModal.classList.contains("active")) {
          tgModal.classList.remove("active");
        } else if (pc.classList.contains("active")) {
          closePlayer(true);
        }
      } else if (e.key === "Backspace" && document.activeElement !== chSearchInput) {
        if (pc.classList.contains("active")) {
          e.preventDefault();
          closePlayer(true);
        }
      }
    });

    // Initialize View: render channel cards first
    renderChannels();

    /* ==================================================
       READ THE URL ON PAGE LOAD
       - If ?id=X is present, select and play that channel
       - If no ?id= parameter (/), show ALL CHANNELS first!
    ================================================== */
    (function handlePageLoad() {
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("id");

      if (requestedId) {
        const targetChannel = findChannelById(requestedId);
        if (targetChannel) {
          // If valid channel ID in URL (e.g. /?id=1, /?id=2), open that stream
          selectChannel(targetChannel, false);
          return;
        }
      }

      // Default opening behavior: SHOW ALL CHANNELS FIRST (do not play stream)
      cleanupPlayback();
      pc.classList.remove("active");
      overlay.style.display = "none";
