<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="tntBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#040203"/>
    </linearGradient>
    <linearGradient id="tntRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <linearGradient id="tntPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
  </defs>
  <rect width="160" height="90" rx="10" fill="url(#tntBg)"/>
  <rect x="3" y="3" width="154" height="84" rx="8" fill="none" stroke="#E50914" stroke-width="1.2" opacity="0.6"/>
  <!-- Circle Logo Badge -->
  <circle cx="34" cy="45" r="21" fill="url(#tntRed)"/>
  <text x="34" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TNT</text>
  <!-- Text -->
  <text x="64" y="42" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">SPORTS</text>
  <!-- Badge 4 -->
  <rect x="131" y="27" width="22" height="22" rx="4" fill="url(#tntPink)"/>
  <text x="142" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="65" y="62" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#FF2A55" letter-spacing="2">LIVE HD</text>
</svg>
