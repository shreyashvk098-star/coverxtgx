<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="tntPremBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180408"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>
    <linearGradient id="tntGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="tntRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
  </defs>
  <rect width="160" height="90" rx="10" fill="url(#tntPremBg)"/>
  <rect x="3" y="3" width="154" height="84" rx="8" fill="none" stroke="url(#tntGold)" stroke-width="1.2" opacity="0.7"/>
  <!-- TNT badge -->
  <circle cx="34" cy="45" r="21" fill="url(#tntRed)"/>
  <text x="34" y="52" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">TNT</text>
  <!-- Text -->
  <text x="64" y="40" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">SPORTS</text>
  <rect x="64" y="47" width="82" height="18" rx="3" fill="url(#tntGold)"/>
  <text x="105" y="60" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1.5">PREMIUM</text>
</svg>
